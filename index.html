<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>English Hero — Learn English from Zero to Hero</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

    <nav class="sidebar-nav" id="sidebar-nav">
      <div class="nav-group-label">Main</div>
      <a class="nav-item" data-route="#/dashboard" href="#/dashboard"><span class="ni-ico">◧</span><span>Dashboard</span></a>

      <a class="nav-item" data-route="#/vocabulary" href="#/vocabulary"><span class="ni-ico">◉</span><span>Vocabulary</span></a>

      <a class="nav-item" data-route="#/listening" href="#/listening"><span class="ni-ico">◐</span><span>Listening</span></a>
      <a class="nav-item" data-route="#/speaking" href="#/speaking"><span class="ni-ico">◍</span><span>Speaking</span></a>
      <a class="nav-item" data-route="#/reading" href="#/reading"><span class="ni-ico">▤</span><span>Reading</span></a>

      <div class="avatar-btn" id="avatar-btn" title="Profile"></div>
    </header>

  </div>
